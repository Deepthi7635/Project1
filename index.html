<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MindEase - Stress Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>MindEase</h1>
  <p>Your daily stress companion</p>

  <div class="container">
    <div class="tracker">
      <h3>Track Stress Level</h3>
      <input type="number" id="stressInput" placeholder="Rate your stress (1–10)">
      <button id="saveBtn">Save & Get Tip</button>
      <p id="message"></p>
    </div>

    <div class="history">
      <h3>History</h3>
      <ul id="historyList"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
